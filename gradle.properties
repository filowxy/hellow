org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
# Disable kotlin DSL all warnings as errors to avoid blocking builds on minor warnings
org.gradle.kotlin.dsl.allWarningsAsErrors=false
# Lower the workers to reduce memory pressure on low-RAM systems
org.gradle.workers.max=2

