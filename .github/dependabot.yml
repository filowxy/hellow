version: 2
updates:
  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # JUnit 6 is a platform major upgrade; keep the 5.x line until the build
      # toolchain is migrated deliberately.
      - dependency-name: 'org.junit.jupiter:*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'org.junit.platform:*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
